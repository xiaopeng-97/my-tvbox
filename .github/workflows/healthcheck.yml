name: 每日测活与重建

on:
  schedule:
    # 每天一次：北京时间 06:10（UTC 22:10）。GitHub Actions 的 cron 是 UTC。
    # 排在整点后 10 分，避开整点调度高峰（整点任务经常排队延迟 20-40 分钟）。
    # 需要恢复一天两跑时，在这里加一条 cron 即可（例如 '10 10 * * *'）。
    - cron: '10 22 * * *'
  workflow_dispatch:
    inputs:
      skip_live:
        description: '跳过直播深度验活（只测点播）'
        required: false
        default: 'false'
      health_workers:
        description: '点播测活并发数（默认 8）'
        required: false
        default: '8'

permissions:
  contents: write

concurrency:
  group: my-tvbox-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 环境信息
        run: |
          python -V
          echo "仓库: ${{ github.repository }}"

      # 纯函数单测：判据（地址解析/加密判定/地址抽取）改错了要在这里就红，
      # 而不是产出一份"全绿但全死链"的配置。
      - name: 单元测试（判据纯函数）
        run: python -m unittest discover -s tests -v

      - name: 点播源测活（四级：列表/搜索/详情/播放地址拉真实分片）
        env:
          HEALTH_WORKERS: ${{ github.event.inputs.health_workers || '8' }}
        run: python scripts/check_health.py

      - name: 直播源深度验活（拉真实分片）
        if: ${{ github.event.inputs.skip_live != 'true' }}
        run: python scripts/check_live.py
        continue-on-error: true      # 直播全挂时不要连带失败，保留旧 live.txt

      - name: 重建配置产物
        env:
          PUBLIC_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: python scripts/build_config.py

      - name: 校验产物完整性
        run: python scripts/validate_dist.py

      - name: 提交变更
        run: |
          git config user.name  "my-tvbox-bot"
          git config user.email "my-tvbox-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "本次无变更"
          else
            git commit -m "chore(auto): $(date -u +'%Y-%m-%d %H:%M') UTC 测活重建"
            git push
          fi
